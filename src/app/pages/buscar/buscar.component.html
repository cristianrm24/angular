<div class="container my-5">

  <h2 class="text-center mb-4">Buscar productos</h2>

  <!-- TARJETA DE BÚSQUEDA -->
  <div class="card shadow-sm p-4 mb-4">

    <div class="row g-3">

      <!-- Texto -->
      <div class="col-md-6">
        <input type="text"
               class="form-control"
               placeholder="Buscar producto..."
               [(ngModel)]="q">
      </div>

      <!-- Precio mínimo -->
      <div class="col-md-3">
        <input type="number"
               class="form-control"
               placeholder="Precio mínimo"
               [(ngModel)]="minPrecio">
      </div>

      <!-- Precio máximo -->
      <div class="col-md-3">
        <input type="number"
               class="form-control"
               placeholder="Precio máximo"
               [(ngModel)]="maxPrecio">
      </div>

      <!-- Botón -->
      <div class="col-12 text-end">
        <button class="btn btn-primary"
                (click)="buscar()">
          Buscar
        </button>
      </div>

    </div>
  </div>

  <!-- CARGANDO -->
  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Buscando productos...</p>
  </div>

  <!-- RESULTADOS -->
  <div class="row" *ngIf="!cargando && productos.length > 0">

    <div class="col-md-4 mb-4" *ngFor="let p of productos">

      <div class="card shadow-sm h-100">

        <div class="text-center pt-4">
          <i class="bi bi-box-seam fs-1 text-secondary"></i>
        </div>

        <div class="card-body text-center">
          <h5 class="card-title">{{ p.nombre }}</h5>

          <p class="mb-1">
            <strong>Precio:</strong>
            <span class="text-success">${{ p.precio }}</span>
          </p>

          <p>
            <strong>Stock:</strong> {{ p.stock }}
          </p>



        </div>
      </div>
    </div>

  </div>

  <!-- SIN RESULTADOS -->
  <div *ngIf="!cargando && productos.length === 0"
       class="text-center text-muted mt-4">
    <i class="bi bi-search fs-1"></i>
    <p class="mt-2">No se encontraron productos</p>
  </div>

</div>
