<h2>Checkout</h2>

<!-- Si no hay productos -->
<div *ngIf="items.length === 0">
  <p>Tu carrito está vacío.</p>
  <a routerLink="/productos">Volver a productos</a>
</div>

<!-- Si hay productos -->
<div *ngIf="items.length > 0">

  <table border="1" cellpadding="8">
    <tr>
      <th>Producto</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Subtotal</th>
    </tr>

    <tr *ngFor="let item of items">
      <td>{{ item.producto.nombre }}</td>
      <td>${{ item.producto.precio }}</td>
      <td>{{ item.cantidad }}</td>
      <td>${{ item.subtotal }}</td>
    </tr>
  </table>

  <h3>Total: ${{ total }}</h3>

  <button (click)="confirmarPedido()">
    Confirmar compra
  </button>

</div>
