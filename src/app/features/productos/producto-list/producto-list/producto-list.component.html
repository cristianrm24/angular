
<div class="container my-5">

  <h2 class="text-center mb-4">Productos</h2>
    <a *ngIf="authService.esAdmin()"
       routerLink="/productos/nuevo"
       class="btn btn-success">
      <i class="bi bi-plus-circle me-1"></i>
      Nuevo Producto
    </a>
  <!-- Indicador de carga -->
  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Cargando productos...</p>
  </div>

  <!-- Lista de productos -->
  <div class="row" *ngIf="!cargando">

    <div class="col-md-4 mb-4" *ngFor="let p of productos">

      <div class="card shadow-sm h-100">

        <!-- Ícono de producto -->
        <div class="text-center pt-4">
          <i class="bi bi-box-seam fs-1 text-secondary"></i>
        </div>

        <div class="card-body text-center">
          <h5 class="card-title">{{ p.nombre }}</h5>

          <p class="mb-1">
            <strong>Precio:</strong>
            <span class="text-success">${{ p.precio }}</span>
          </p>

          <p class="mb-3">
            <strong>Stock:</strong> {{ p.stock }}
          </p>

          <!-- Botones -->
<!-- Botones -->
<div class="d-grid gap-2">

  <!-- SOLO ADMIN -->
  <button *ngIf="authService.esAdmin()"
          class="btn btn-outline-primary btn-sm"
          (click)="editar(p)">
    Editar
  </button>

  <!-- SOLO ADMIN -->
  <button *ngIf="authService.esAdmin()"
          class="btn btn-outline-danger btn-sm"
          (click)="eliminar(p)">
    Eliminar
  </button>

  <!-- TODOS LOS USUARIOS -->
  <button class="btn btn-primary btn-sm"
          (click)="agregar(p)">
    Agregar al carrito
  </button>

</div>

        </div>
      </div>

    </div>

  </div>
</div>
