<div class="container d-flex justify-content-center align-items-center my-5">

  <div class="card shadow-lg p-4" style="max-width: 500px; width:100%;">

    <h2 class="text-center mb-4">Nuevo Producto</h2>

    <form (ngSubmit)="guardar()" #formProducto="ngForm">

      <!-- Nombre -->
      <div class="form-floating mb-3">
        <input type="text"
               class="form-control"
               id="nombre"
               [(ngModel)]="producto.nombre"
               name="nombre"
               placeholder="Nombre"
               required>
        <label for="nombre">Nombre del producto</label>
      </div>

      <!-- Precio -->
      <div class="form-floating mb-3">
        <input type="number"
               class="form-control"
               id="precio"
               [(ngModel)]="producto.precio"
               name="precio"
               placeholder="Precio"
               required>
        <label for="precio">Precio</label>
      </div>

      <!-- Stock -->
      <div class="form-floating mb-3">
        <input type="number"
               class="form-control"
               id="stock"
               [(ngModel)]="producto.stock"
               name="stock"
               placeholder="Stock"
               required>
        <label for="stock">Stock disponible</label>
      </div>

      <!-- Categoría -->
      <div class="mb-4">
        <label class="form-label fw-bold">Categoría</label>
        <select class="form-select"
                [(ngModel)]="producto.categoria.idCategoria"
                name="idCategoria"
                required>

          <option [ngValue]="null">Seleccione una categoría</option>

          <option *ngFor="let c of categorias"
                  [ngValue]="c.idCategoria">
            {{ c.nombre }}
          </option>
        </select>
      </div>

      <!-- Botón guardar -->
      <button type="submit"
              class="btn btn-primary w-100"
              [disabled]="guardando || !formProducto.form.valid">

        <span *ngIf="!guardando">Guardar producto</span>

        <span *ngIf="guardando">
          <span class="spinner-border spinner-border-sm"></span>
          Guardando...
        </span>

      </button>

    </form>

  </div>
</div>
